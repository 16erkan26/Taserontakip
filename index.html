<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1628">
<title>Taşeron Takip</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taşeron Takip">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0a1426;--bg2:#0e1b33;--card:#13233f;--card2:#182b4c;--line:rgba(160,190,230,.16);--line2:rgba(160,190,230,.28);
  --ink:#f2f6fc;--ink2:#c3d0e4;--mut:#8da0bd;
  --acc:#2ea8ff;--acc2:#0b5bd3;
  --ok:#22c55e;--okb:rgba(34,197,94,.15);
  --warn:#f5a524;--warnb:rgba(245,165,36,.16);
  --bad:#f0524f;--badb:rgba(240,82,79,.16);
  --ban:#c084fc;--banb:rgba(192,132,252,.16);
  --nav:76px;--safeb:env(safe-area-inset-bottom,0px);--safet:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Inter','Segoe UI',Roboto,system-ui,-apple-system,sans-serif;font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:none;overflow-x:hidden}
main,.sh-body{overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- Üst bar ---- */
.top{position:sticky;top:0;z-index:20;padding:calc(var(--safet) + 14px) 18px 12px;background:linear-gradient(180deg,var(--bg) 70%,rgba(10,20,38,.0));}
.top-row{display:flex;align-items:center;gap:12px}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.02em;flex:1;line-height:1.15}
.top .sub{font-size:14px;color:var(--mut);margin-top:2px;font-weight:500}
.ibtn{width:48px;height:48px;border-radius:15px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2)}
.ibtn:active{transform:scale(.96)}
.ibtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Lokasyon çipleri */
.chips{display:flex;gap:10px;overflow-x:auto;padding:14px 18px 4px;margin:0 -18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:44px;padding:0 18px;border-radius:22px;background:var(--card);border:1px solid var(--line);font-size:15px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:8px;white-space:nowrap}
.chip .n{font-size:13px;font-weight:700;color:var(--mut);background:rgba(255,255,255,.06);border-radius:10px;padding:2px 8px}
.chip.on{background:linear-gradient(135deg,var(--acc2),var(--acc));border-color:transparent;color:#fff}
.chip.on .n{color:#fff;background:rgba(255,255,255,.2)}

/* ---- İçerik ---- */
main{padding:4px 18px calc(var(--nav) + var(--safeb) + 24px)}
.view{display:none;animation:vin .25s ease}
.view.on{display:block}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-h h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
.link{font-size:15px;font-weight:700;color:var(--acc);display:flex;align-items:center;gap:2px;min-height:40px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;padding:18px}
.tap:active{transform:scale(.985);filter:brightness(1.08)}

/* Hero */
.hero{display:flex;align-items:center;gap:20px;padding:20px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:36px;font-weight:800;line-height:1}
.ring .c span{font-size:13px;color:var(--mut);font-weight:600;margin-top:4px}
.hero h3{font-size:19px;font-weight:800;line-height:1.3}
.legend{margin-top:12px;display:grid;gap:8px}
.legend div{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink2);font-weight:500}
.legend i{width:12px;height:12px;border-radius:4px;flex:none}
.legend b{margin-left:auto;font-size:17px;color:var(--ink)}

/* Kutular */
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tile{padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-height:132px;text-align:left}
.tile .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.tile .ic svg{width:26px;height:26px}
.tile b{font-size:32px;font-weight:800;line-height:1;letter-spacing:-.02em}
.tile span{font-size:15px;color:var(--ink2);font-weight:600;line-height:1.3}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}.c-ban{color:var(--ban)}.c-acc{color:var(--acc)}
.b-ok{background:var(--okb);color:var(--ok)}.b-warn{background:var(--warnb);color:var(--warn)}.b-bad{background:var(--badb);color:var(--bad)}.b-ban{background:var(--banb);color:var(--ban)}.b-acc{background:rgba(46,168,255,.15);color:var(--acc)}

/* Liste satırları */
.list{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.list>*{min-width:0}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%;min-height:72px}
.row .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.row .tx{flex:1;min-width:0}
.row .t{font-size:16.5px;font-weight:700;line-height:1.3;word-break:break-word}
.row .s{font-size:14.5px;color:var(--mut);margin-top:3px;line-height:1.35;font-weight:500}
.row .s.wrap{white-space:normal}
.row .chev{color:var(--mut)}
.av{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none;letter-spacing:.02em}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;font-size:13.5px;font-weight:700;white-space:nowrap;flex:none}
.pill svg{width:16px;height:16px}

/* Arama + filtre */
.search{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;border-radius:18px;background:var(--card);border:1px solid var(--line2);color:var(--mut)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:17px;color:var(--ink)}
.search input::placeholder{color:var(--mut)}
.seg{display:flex;gap:8px;overflow-x:auto;margin:14px -18px 4px;padding:0 18px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;height:42px;padding:0 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:15px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:8px}
.seg button .n{font-size:13px;font-weight:800;opacity:.8}
.seg button.on{background:var(--ink);color:#0b1628;border-color:transparent}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:16px}
.tabs2 button{height:46px;border-radius:13px;font-size:16px;font-weight:700;color:var(--ink2)}
.tabs2 button.on{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff}

/* Firma kartı */
.firm{display:block;width:100%;text-align:left}
.firm-h{display:flex;align-items:flex-start;gap:14px}
.firm-h .t{font-size:18px;font-weight:800;line-height:1.3}
.firm-h .s{font-size:14.5px;color:var(--mut);margin-top:4px;font-weight:500}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stats3 div{background:rgba(255,255,255,.04);border-radius:14px;padding:10px 8px;text-align:center}
.stats3 b{display:block;font-size:24px;font-weight:800}
.stats3 span{font-size:13px;color:var(--mut);font-weight:600}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:14px;display:flex}
.bar i{display:block;height:100%}
.bar-l{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2);margin-top:8px;font-weight:600}

/* Eğitim kartı */
.trn{display:flex;gap:16px;align-items:center}
.ring.sm{width:92px;height:92px}
.ring.sm .c b{font-size:24px}
.ring.sm .c span{font-size:12px}
.trn h3{font-size:17.5px;font-weight:800;line-height:1.3}
.trn .cat{font-size:14px;color:var(--mut);margin-top:3px;font-weight:600}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:10px}
.mini div{font-size:14.5px;color:var(--ink2);display:flex;align-items:center;gap:8px;font-weight:500}
.mini i{width:10px;height:10px;border-radius:3px;flex:none}
.mini b{color:var(--ink)}
.score{width:58px;height:58px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.score b{font-size:22px;font-weight:800;line-height:1}
.score span{font-size:11px;font-weight:700;opacity:.85}

.empty{padding:34px 18px;text-align:center;color:var(--mut);font-size:16px;font-weight:500;border:1.5px dashed var(--line2);border-radius:20px}
.empty svg{width:40px;height:40px;margin:0 auto 10px;display:block;opacity:.7}
.note{font-size:14px;color:var(--mut);margin-top:12px;line-height:1.45}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;font-size:14.5px;font-weight:600;margin-top:12px;line-height:1.35}

/* ---- Alt menü ---- */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav) + var(--safeb));padding:8px 8px calc(8px + var(--safeb));display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(12,22,42,.92);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
nav.bn button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-radius:16px;color:var(--mut);font-size:12.5px;font-weight:700;position:relative}
nav.bn button svg{width:27px;height:27px}
nav.bn button.on{color:#fff}
nav.bn button.on::before{content:"";position:absolute;top:2px;width:56px;height:34px;border-radius:17px;background:rgba(46,168,255,.22);z-index:-1}
nav.bn button.on svg{color:var(--acc)}
nav.bn .dot{position:absolute;top:4px;left:calc(50% + 8px);min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center}

/* ---- Detay sayfası ---- */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.7,.2,1);overscroll-behavior:contain}
.sheet.on{transform:none}
.sh-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:calc(var(--safet) + 12px) 14px 12px;background:rgba(10,20,38,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.sh-top h2{font-size:19px;font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-body{padding:18px 18px calc(30px + var(--safeb))}
.p-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 4px}
.p-head .av{width:84px;height:84px;border-radius:26px;font-size:30px}
.p-head h3{font-size:24px;font-weight:800;margin-top:14px;line-height:1.2}
.p-head p{font-size:15.5px;color:var(--ink2);margin-top:6px;font-weight:500}
.verdict{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:20px;margin-top:18px}
.verdict svg{width:32px;height:32px}
.verdict b{font-size:19px;font-weight:800;display:block}
.verdict ul{list-style:none;margin-top:8px;display:grid;gap:6px}
.verdict li{font-size:15px;font-weight:500;color:var(--ink);line-height:1.4;padding-left:14px;position:relative}
.verdict li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:3px;background:currentColor;opacity:.7}
.kv{display:grid;gap:0}
.kv div{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:16px}
.kv div:last-child{border-bottom:0}
.kv span{color:var(--mut);font-weight:500}
.kv b{font-weight:700;text-align:right}
.call{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;font-size:16.5px;font-weight:700;margin-top:14px;text-decoration:none}

/* Ayarlar alanları */
.fld{display:block;margin-top:12px}
.fld span{display:block;font-size:14.5px;color:var(--mut);font-weight:600;margin-bottom:8px}
.fld input{width:100%;height:54px;padding:0 16px;border-radius:16px;background:var(--card);border:1px solid var(--line2);font-size:16px;outline:0}
.fld input:focus{border-color:var(--acc)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;border-radius:16px;font-size:16px;font-weight:700;margin-top:12px;background:var(--card);border:1px solid var(--line2)}
.btn.pri{background:linear-gradient(135deg,var(--acc2),var(--acc));border-color:transparent;color:#fff}

.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safeb) + 16px);transform:translate(-50%,20px);opacity:0;z-index:80;background:#e9f1fb;color:#0b1628;font-size:15px;font-weight:700;padding:14px 20px;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.4);transition:.25s;pointer-events:none;max-width:calc(100% - 36px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (min-width:700px){
  body{background:#050b17}
  .shell{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);box-shadow:0 0 60px rgba(0,0,0,.5)}
  nav.bn,.sheet{max-width:480px;margin:0 auto}
  .sheet{left:50%;right:auto;width:480px;transform:translateX(110vw)}
  .sheet.on{transform:translateX(-50%)}
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="top-row">
      <div style="flex:1;min-width:0"><h1 id="ttl">Genel Durum</h1><div class="sub" id="subt"></div></div>
      <button class="ibtn" id="btnRefresh" aria-label="Yenile"></button>
      <button class="ibtn" id="btnSet" aria-label="Ayarlar"></button>
    </div>
    <div class="chips" id="siteChips"></div>
  </header>
  <main>
    <section class="view on" id="v-ozet"></section>
    <section class="view" id="v-pers"></section>
    <section class="view" id="v-firma"></section>
    <section class="view" id="v-egitim"></section>
    <section class="view" id="v-evrak"></section>
  </main>
</div>
<nav class="bn" id="nav"></nav>
<div id="sheets"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
/* =========================================================
   TAŞERON TAKİP – Mobil (yalnızca görüntüleme)
   Veri kaynağı sırası:
   1) Sunucu: window.API_BASE_URL veya Ayarlar'daki adres  → GET {adres}/state  (panelin appState JSON'u)
   2) Aynı tarayıcıdaki Taşeron Yönetim Paneli verisi (localStorage: taseron_app_state_v3)
   3) Dosyadan yüklenen veri (Ayarlar → Dosyadan veri yükle)
   4) Demo veri
   ========================================================= */
var PANEL_KEY='taseron_app_state_v3', CACHE_KEY='typm_cache', SRV_KEY='typm_server', SITE_KEY='typm_site';
var SITES=['Bursa','Gönen','Gebze','Gölcük','Bergama'];

/* ---------- İkonlar ---------- */
var P={
 home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 users:'<circle cx="9" cy="7" r="4"/><path d="M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/><path d="M22 21v-1a6 6 0 0 0-4-5.6"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v1"/>',
 build:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/>',
 grad:'<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
 file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/>',
 warn:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
 ok:'<circle cx="12" cy="12" r="10"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
 x:'<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/>',
 ban:'<circle cx="12" cy="12" r="10"/><path d="M4.9 4.9l14.2 14.2"/>',
 clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
 search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
 set:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
 ref:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
 pin:'<path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',
 right:'<path d="m9 18 6-6-6-6"/>',
 left:'<path d="m15 18-6-6 6-6"/>',
 phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
 clip:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h4"/>',
 wrench:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/>',
 id:'<rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="12" r="2.2"/><path d="M14 10h4M14 14h3"/>',
 award:'<circle cx="12" cy="8" r="6"/><path d="M15.5 13 17 22l-5-3-5 3 1.5-9"/>',
 upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/>',
 server:'<rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 6h.01M6 18h.01"/>',
 drop:'<path d="M12 2.7 6.3 8.4a8 8 0 1 0 11.4 0z"/>',
 cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
 info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>'
};
function I(n,c){return '<svg class="i'+(c?' '+c:'')+'" viewBox="0 0 24 24">'+(P[n]||'')+'</svg>';}

/* ---------- Yardımcılar ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function inDays(n){var d=new Date();d.setDate(d.getDate()+n);return fmt(d);}
function trDate(s){return s?String(s).slice(0,10).split('-').reverse().join('.'):'-';}
function daysLeft(s){if(!s)return -9999;var a=String(s).slice(0,10).split('-').map(Number);var t=new Date(a[0],a[1]-1,a[2]);var n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/86400000);}
function maskTc(t){t=String(t||'');if(t.length<4)return t?'***':'-';return new Array(t.length-2).join('*')+t.slice(-3);}
function initials(n){var p=String(n||'?').trim().split(/\s+/);return ((p[0]||'')[0]||'?').toLocaleUpperCase('tr')+((p.length>1?p[p.length-1][0]:'')||'').toLocaleUpperCase('tr');}
function trLow(s){return String(s||'').toLocaleLowerCase('tr');}
function daysTxt(n){if(n<0)return Math.abs(n)+' gün önce doldu';if(n===0)return 'Bugün doluyor';return n+' gün kaldı';}
function cleanTitle(t){return String(t||'').replace(/^\d+\.\s*/,'');}
var AVC=['#2563eb','#0891b2','#7c3aed','#db2777','#ea580c','#16a34a','#0d9488','#4f46e5'];
function avColor(s){var h=0;s=String(s||'');for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return AVC[h%AVC.length];}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){e.classList.remove('on');},2200);}

/* ---------- Veri yükleme ---------- */
var S=null, SRC={kind:'demo',label:'Demo veri',at:null,note:''};
function norm(d){
 d=d||{};['companies','personnel','documents','trainings','videos','exams','examResults','bans','requests','sm'].forEach(function(k){if(!Array.isArray(d[k]))d[k]=[];});
 if(!d.videos.length)d.videos=[{id:'V1',title:'1. Temel Saha İSG Oryantasyonu',category:'Zorunlu İSG'}];
 return d;
}
function serverUrl(){return (window.API_BASE_URL||localStorage.getItem(SRV_KEY)||'').trim().replace(/\/+$/,'');}
function fromPanel(){try{var s=localStorage.getItem(PANEL_KEY);if(s){var d=JSON.parse(s);if(d&&Array.isArray(d.personnel))return d;}}catch(e){}return null;}
function fromCache(){try{var s=localStorage.getItem(CACHE_KEY);if(s)return JSON.parse(s);}catch(e){}return null;}
function load(force){
 var url=serverUrl(), btn=$('btnRefresh');
 btn.classList.add('spin');
 function done(){btn.classList.remove('spin');renderAll();if(force)toast('Veriler güncellendi');}
 function local(note){
  var p=fromPanel();
  if(p){S=norm(p);SRC={kind:'panel',label:'Bu cihazdaki panel verisi',at:new Date(),note:note||''};return done();}
  var c=fromCache();
  if(c&&c.data){S=norm(c.data);SRC={kind:c.kind||'file',label:c.kind==='server'?'Sunucu (son alınan veri)':'Yüklenen dosya',at:c.at?new Date(c.at):null,note:note||''};return done();}
  S=norm(demoState());SRC={kind:'demo',label:'Demo veri',at:new Date(),note:note||''};done();
 }
 if(url){
  var ctl=window.AbortController?new AbortController():null;var to=setTimeout(function(){ctl&&ctl.abort();},10000);
  fetch(url+'/state',{cache:'no-store',credentials:'include',signal:ctl?ctl.signal:undefined}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
   .then(function(d){clearTimeout(to);var st=d&&d.state?d.state:d;S=norm(st);var at=new Date();SRC={kind:'server',label:'Sunucu',at:at,note:''};
     try{localStorage.setItem(CACHE_KEY,JSON.stringify({kind:'server',at:at.toISOString(),data:st}));}catch(e){}done();})
   .catch(function(){clearTimeout(to);local('Sunucuya ulaşılamadı; son kayıtlı veri gösteriliyor.');});
 }else local();
}

/* ---------- Durum hesapları (panel ile aynı kurallar) ---------- */
function comp(id){return S.companies.find(function(c){return c.id===id;})||{};}
function video(id){return S.videos.find(function(v){return v.id===id;})||{id:id,title:id};}
function isBanned(p){return S.bans.some(function(b){return b.tc&&b.tc===p.tc;});}
function banInfo(p){return S.bans.find(function(b){return b.tc&&b.tc===p.tc;});}
function siteOfP(p){return comp(p.companyId).site||'';}
function inSite(site){return CUR_SITE==='Tümü'||site===CUR_SITE;}
function docsOf(pid){return S.documents.filter(function(d){return d.personnelId===pid;});}
function trainOf(pid,vid){var l=S.trainings.filter(function(t){return t.personnelId===pid&&t.videoId===vid;}).sort(function(a,b){return String(b.expireDate).localeCompare(String(a.expireDate));});return l[0]||null;}
function trStatus(pid,vid){var t=trainOf(pid,vid);if(!t)return{k:'none',t:null,txt:'Almadı'};var n=daysLeft(t.expireDate);
 if(n<0)return{k:'bad',t:t,n:n,txt:'Süresi doldu'};if(n<=30)return{k:'warn',t:t,n:n,txt:n+' gün kaldı'};return{k:'ok',t:t,n:n,txt:'Geçerli'};}
function examOf(p){return S.examResults.filter(function(r){return (r.pid&&r.pid===p.id)||(!r.pid&&trLow(r.name)===trLow(p.name));}).sort(function(a,b){return String(b.date).localeCompare(String(a.date));});}
var _pc={};
function pStat(p){
 if(_pc[p.id])return _pc[p.id];
 var docs=docsOf(p.id),exp=[],soon=[];
 docs.forEach(function(d){var n=daysLeft(d.expireDate);if(n<0)exp.push(d);else if(n<=30)soon.push(d);});
 var tr=trStatus(p.id,'V1'),ban=isBanned(p),bad=[],warn=[];
 if(ban){var b=banInfo(p);bad.push('Sahaya giriş yasağı'+(b&&b.reason?': '+b.reason:''));}
 if(!docs.length)bad.push('Hiç evrak yüklenmemiş');
 exp.forEach(function(d){bad.push(d.type+' – süresi dolmuş');});
 if(tr.k==='none')bad.push('Temel İSG eğitimi alınmamış');else if(tr.k==='bad')bad.push('Temel İSG eğitiminin süresi dolmuş');
 soon.forEach(function(d){warn.push(d.type+' – '+daysTxt(daysLeft(d.expireDate)));});
 if(tr.k==='warn')warn.push('Temel İSG eğitimi – '+tr.txt);
 var lvl=ban?'ban':bad.length?'bad':warn.length?'warn':'ok';
 return (_pc[p.id]={lvl:lvl,ok:lvl==='ok'||lvl==='warn',bad:bad,warn:warn,tr:tr,docs:docs,exp:exp,soon:soon});
}
var LV={ok:{c:'ok',t:'Sahaya uygun',ic:'ok'},warn:{c:'warn',t:'Uygun · süre yaklaşıyor',ic:'clock'},bad:{c:'bad',t:'Sahaya giremez',ic:'x'},ban:{c:'ban',t:'Yasaklı',ic:'ban'}};
function pills(l){var v=LV[l];return '<span class="pill b-'+v.c+'">'+I(v.ic)+(l==='warn'?'Süre yaklaşıyor':v.t)+'</span>';}
function people(){return S.personnel.filter(function(p){return inSite(siteOfP(p));});}
function firms(){return S.companies.filter(function(c){return inSite(c.site);});}
function reqSite(r){return r.site||comp(r.companyId).site||'';}

function ring(pct,size,stroke,segs){
 var r=(size-stroke)/2,C=2*Math.PI*r,off=0,h='<svg viewBox="0 0 '+size+' '+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="'+stroke+'"/>';
 segs.forEach(function(s){if(s.v<=0)return;var L=C*s.v;h+='<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+s.c+'" stroke-width="'+stroke+'" stroke-linecap="butt" stroke-dasharray="'+L+' '+(C-L)+'" stroke-dashoffset="'+(-off)+'"/>';off+=L;});
 return h+'</svg>';
}

 if(SRC.kind==='demo')h+='<div class="banner b-acc">'+I('info')+'<span>Örnek veri gösteriliyor. Gerçek veri için Ayarlar\'dan sunucu adresini girin veya veri dosyası yükleyin.</span></div>';

 h+='<div class="sec"><div class="sec-h"><h2>Dikkat gerekenler</h2>'+(att.length?'<button class="link" data-go="pers:issue">Tümü'+I('right')+'</button>':'')+'</div>';
 h+=att.length?'<div class="list">'+att.slice(0,5).map(function(x){var r=x.s.bad[0]||x.s.warn[0]||'';return personRow(x.p,r);}).join('')+'</div>'

 h+='</div>';

 $('v-ozet').innerHTML=h;
 function tile(c,ic,n,t,go){return '<button class="tile tap" data-go="'+go+'"><div class="ic b-'+c+'">'+I(ic)+'</div><b class="c-'+(c==='acc'?'ink':c)+'">'+n+'</b><span>'+t+'</span></button>';}

  if(g[0]==='evrak'&&g[1])EF=g[1];if(g[0]==='egitim'&&g[1])TSEG=g[1];if(g[0]==='pers'&&g[1])PF=g[1];
  renderAll();setTab(g[0]);return;}
 if(d.act==='srv'){var v=($('srv').value||'').trim();try{if(v)localStorage.setItem(SRV_KEY,v);else localStorage.removeItem(SRV_KEY);}catch(x){}closeTop();load(true);return;}
 if(d.act==='file'){$('fileIn').click();return;}
 if(d.act==='demo'){try{localStorage.removeItem(CACHE_KEY);localStorage.removeItem(SRV_KEY);}catch(x){}
  S=norm(demoState());SRC={kind:'demo',label:'Demo veri',at:new Date(),note:''};closeTop();renderAll();toast('Örnek veri yüklendi');return;}
});
document.addEventListener('input',function(e){if(e.target.id==='pq'){PQ=e.target.value;var pos=e.target.selectionStart;renderPers();var n=$('pq');n.focus();try{n.setSelectionRange(pos,pos);}catch(x){}}});
document.addEventListener('change',function(e){
 if(e.target.id!=='fileIn'||!e.target.files[0])return;var fr=new FileReader();
 fr.onload=function(){try{var d=JSON.parse(fr.result);d=d&&d.state?d.state:d;if(!d||!Array.isArray(d.personnel))throw 0;
   S=norm(d);var at=new Date();SRC={kind:'file',label:'Yüklenen dosya',at:at,note:''};try{localStorage.setItem(CACHE_KEY,JSON.stringify({kind:'file',at:at.toISOString(),data:d}));}catch(x){}
   closeTop();renderAll();toast('Veri yüklendi: '+d.personnel.length+' personel');}catch(x){toast('Dosya okunamadı. Panel veri dosyası seçin.');}};
 fr.readAsText(e.target.files[0]);
});
$('btnRefresh').innerHTML=I('ref');$('btnSet').innerHTML=I('set');
$('btnRefresh').addEventListener('click',function(){load(true);});
$('btnSet').addEventListener('click',openSettings);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&(serverUrl()||SRC.kind==='panel'))load(false);});
window.addEventListener('storage',function(e){if(e.key===PANEL_KEY&&SRC.kind==='panel')load(false);});

load(false);
})();
